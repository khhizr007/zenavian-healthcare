[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# DEMO ONLY: all form endpoints go to a function that accepts and discards submissions.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/demo-form"
  status = 200
  force = true